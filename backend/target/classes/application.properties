spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartfee_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# jwt settings
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Webhook secret for payment gateway HMAC verification. In production set via
# environment variable PAYMENT_WEBHOOK_SECRET or system property -Dpayment.webhook.secret
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET}

logging.level.org.springframework=INFO
logging.level.com.smartfee=DEBUG
